[project]
name = "pairs-trading"
version = "0.1.0"
description = "Pairs trading on NSE F&O stocks: cointegration, spreads, half-lives and rule backtests after costs, with a live pair explorer."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dhirajdas18" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "yfinance>=1.8.0",
]

[project.scripts]
pt = "pt.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pt"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
